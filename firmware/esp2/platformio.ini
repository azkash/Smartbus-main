; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
board_build.partitions = huge_app.csv
framework = arduino
; NAT removed: lwIP in current framework has no ip_napt_enable.
; WEBSOCKETS_SERVER_CLIENT_MAX raised from the default 5 so the WS server can
; track as many clients as the softAP allows (headunit + gateway + seats).
build_flags =
  -D WEBSOCKETS_SERVER_CLIENT_MAX=12
lib_deps =
  fastled/FastLED
  ; tzapu/WiFiManager  ; disabled — straight to AP
  links2004/WebSockets @ ^2.6.1
  bblanchon/ArduinoJson @ ^6.21.0
monitor_speed = 115200
; monitor_port = COM7
