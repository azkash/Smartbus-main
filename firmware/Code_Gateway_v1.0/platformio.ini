
; PlatformIO Project Configuration File
;
;   Slave Gateway — WiFi/WebSocket range extender for the bus seat system.
;   No audio, no LEDs, no sensors — it only relays WebSocket traffic between
;   far-away seat nodes and the master.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = C:/.pio-napt

[env:esp32doit-devkit-v1]
; Core 3.x is required for the explicit WPA2 TKIP+CCMP softAP configuration
; used by the ESP32-C3 Super Mini seat nodes.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32doit-devkit-v1
board_build.partitions = huge_app.csv
framework = arduino
build_flags =
  -D WEBSOCKETS_SERVER_CLIENT_MAX=12   ; hold many downstream seats (default 5)
lib_deps =
  links2004/WebSockets @ ^2.6.1
monitor_speed = 115200
